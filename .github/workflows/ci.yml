name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 22.14.0

jobs:
  check:
    name: Check @preptex/ui
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, test, type-test, and verify package
        run: npm run check

      - name: Inspect publishable tarball
        run: npm run pack:check

      - name: Verify isolated consumer with TypeScript 4.9
        run: npm run consumer:check
